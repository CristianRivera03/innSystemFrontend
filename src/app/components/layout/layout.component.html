<div class="flex h-screen bg-main">

    <!-- Mobile Header -->
    <div class="cds-mobile-header">
        <span class="cds-mobile-header__brand">
            <span class="text-brand font-bold">inn</span>System
        </span>
        <button class="cds-hamburger" (click)="isSidebarOpen = !isSidebarOpen">
            <span class="material-symbols-outlined">{{ isSidebarOpen ? 'close' : 'menu' }}</span>
        </button>
    </div>

    <!-- Sidebar Backdrop (mobile) -->
    <div class="cds-sidebar-backdrop" [class.cds-sidebar-backdrop--visible]="isSidebarOpen" (click)="isSidebarOpen = false"></div>

    <!-- Sidebar -->
    <aside class="cds-sidebar" [class.cds-sidebar--open]="isSidebarOpen">

        <div class="cds-sidebar__header">
            <h2 class="cds-sidebar__brand">
                <span>inn</span>System
            </h2>
            <p style="font-size:0.75rem; color:var(--cds-text-secondary); margin-top:0.125rem;">Hotel Continental</p>
        </div>

        <nav class="cds-sidebar__nav">
            @for (modulo of currentUser?.allowedModules; track modulo.idModule){
                <a [routerLink]="modulo.frontendPath"
                   routerLinkActive="cds-sidebar__nav-item--active"
                   [routerLinkActiveOptions]="{exact: modulo.frontendPath === '/dashboard/feed'}"
                   class="cds-sidebar__nav-item"
                   (click)="isSidebarOpen = false">
                    <span class="material-symbols-outlined">{{ modulo.icon }}</span>
                    <span>{{ modulo.name }}</span>
                </a>
            }
        </nav>

        <div class="cds-sidebar__footer">
            <div class="cds-sidebar__user">
                <div class="cds-sidebar__avatar">
                    {{ currentUser?.firstName?.charAt(0) }}
                </div>
                <div class="cds-sidebar__user-info">
                    <span class="cds-sidebar__user-name">{{ currentUser?.firstName }} {{ currentUser?.lastName }}</span>
                    <span class="cds-sidebar__user-role">{{ currentUser?.roleName }}</span>
                </div>
            </div>

            <div style="display:flex; gap:0.5rem; margin-top:0.75rem;">
                <button (click)="toggleTheme()" class="cds-btn-ghost cds-btn--sm" style="flex:1;">
                    <span class="material-symbols-outlined" style="font-size:1rem;">
                        {{ isDarkMode ? 'light_mode' : 'dark_mode' }}
                    </span>
                    {{ isDarkMode ? 'Modo claro' : 'Modo oscuro' }}
                </button>
            </div>

            <button (click)="logout()" class="cds-btn-danger cds-btn--sm" style="width:100%; margin-top:0.5rem;">
                <span class="material-symbols-outlined" style="font-size:1rem;">logout</span>
                Cerrar Sesión
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto bg-main" style="transition: background-color 0.15s ease;">
        <router-outlet></router-outlet>
    </main>
</div>
