<div class="cds-login-wrapper">

    <div class="cds-login-card cds-animate-fade-in">

        <!-- Formulario -->
        <div class="cds-login-form">
            <h1>Iniciar Sesión</h1>
            <p>Accede al sistema de gestión hotelera con tu cuenta.</p>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" style="display:flex; flex-direction:column; gap:1.25rem;">

                <div class="cds-form-item">
                    <label class="cds-label">Correo Electrónico</label>
                    <input class="cds-text-input" type="email" formControlName="email" placeholder="tucorreo@mail.com">
                    @if(loginForm.get('email')?.invalid && loginForm.get('email')?.touched){
                        <small class="cds-form-error">Ingresa un correo válido</small>
                    }
                </div>

                <div class="cds-form-item">
                    <label class="cds-label">Contraseña</label>
                    <div style="position:relative;">
                        <input class="cds-text-input" [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Ingresa tu contraseña" style="padding-right:2.5rem;">
                        <span class="material-symbols-outlined" 
                              style="position:absolute; top:50%; right:0.75rem; transform:translateY(-50%); color:var(--cds-text-secondary); cursor:pointer; font-size:1.25rem;"
                              (click)="showPassword = !showPassword">
                            {{ showPassword ? 'visibility_off' : 'visibility' }}
                        </span>
                    </div>
                    <div style="text-align: right; margin-top: 0.5rem;">
                        <a routerLink="/forgot-password" class="cds-link" style="font-size: 0.875rem; font-weight: 500;">¿Olvidaste tu contraseña?</a>
                    </div>
                </div>

                <button class="cds-btn-primary" type="submit" [disabled]="loginForm.invalid" style="width:100%; margin-top:0.5rem;">
                    Ingresar
                </button>

                @if(errorMessage) {
                    <div style="background: var(--cds-support-error-10); border-left: 4px solid var(--cds-support-error); padding: 0.75rem; margin-top: 1rem;">
                        <p style="color: var(--cds-support-error); font-size: 0.875rem; margin: 0; font-weight: 500;">
                            {{ errorMessage }}
                        </p>
                    </div>
                }
            </form>
        </div>

        <!-- Imagen -->
        <div class="cds-login-image">
            <img
              style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition: opacity 0.6s ease;"
              src="/photo/login-photo.jpg"
              alt="Hotel Continental"
              [style.opacity]="isDarkMode ? '0' : '1'">

            <img
              style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition: opacity 0.6s ease;"
              src="/photo/login-photo-night.png"
              alt="Hotel Continental — Noche"
              [style.opacity]="isDarkMode ? '1' : '0'">
        </div>

    </div>

    <!-- Theme Toggle -->
    <button type="button" (click)="toggleTheme()" class="cds-login-theme-btn">
        @if(isDarkMode) {
            <span class="material-symbols-outlined" style="color:var(--cds-support-warning); font-size:1.25rem;">light_mode</span>
        } @else {
            <span class="material-symbols-outlined" style="font-size:1.25rem;">dark_mode</span>
        }
    </button>
</div>
