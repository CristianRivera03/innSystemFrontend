@if (isOpen) {
    <div class="cds-modal-overlay">
        <div class="cds-modal" style="max-width:32rem;">

            <div class="cds-modal__header">
                <h2 class="cds-modal__title">{{ serviceToEdit ? 'Editar Servicio' : 'Nuevo Servicio' }}</h2>
                <button class="cds-modal__close" (click)="closeModal()">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>

            <div class="cds-modal__body">
                <form [formGroup]="serviceForm" (ngSubmit)="onSubmit()" style="display:flex; flex-direction:column; gap:1rem;">
                    
                    <!-- Nombre del servicio -->
                    <div class="cds-form-item">
                        <label class="cds-label" for="srv-name">Nombre del Servicio</label>
                        <input class="cds-text-input" type="text" id="srv-name" formControlName="name" placeholder="Ej: Wi-Fi Alta Velocidad">
                        @if(serviceForm.get('name')?.invalid && serviceForm.get('name')?.touched){
                            <small class="cds-form-error">El nombre es requerido</small>
                        }
                    </div>

                    <!-- Submit -->
                    <button class="cds-btn-primary" type="submit" [disabled]="serviceForm.invalid || isSaving" style="margin-top:1rem; display:flex; justify-content:center; align-items:center; gap:0.5rem; width:100%;">
                        @if (isSaving) {
                            <span class="material-symbols-outlined" style="animation:cds-spin 0.7s linear infinite; font-size:1.125rem;">progress_activity</span>
                            {{ serviceToEdit ? 'Actualizando...' : 'Guardando...' }}
                        } @else {
                            {{ serviceToEdit ? 'Actualizar Servicio' : 'Guardar Servicio' }}
                        }
                    </button>
                </form>
            </div>
        </div>
    </div>
}
