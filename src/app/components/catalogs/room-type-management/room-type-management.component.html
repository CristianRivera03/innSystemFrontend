<div style="display:flex; flex-direction:column; height:100%;">

    <div class="cds-catalog-column__header">
        <div class="cds-catalog-column__title">
            <span class="material-symbols-outlined">category</span>
            <div>
                <h3>Tipos de Habitación</h3>
                <p>Categorías de habitaciones.</p>
            </div>
        </div>
        <button (click)="openCreateModal()" class="cds-btn-icon" style="color:var(--cds-interactive);" title="Nuevo Tipo">
            <span class="material-symbols-outlined">add</span>
        </button>
    </div>

    <div class="cds-catalog-column__body custom-scrollbar">

        <div *ngIf="isLoading" class="cds-spinner" style="padding:2rem;">
            <span class="material-symbols-outlined">progress_activity</span>
        </div>

        <div *ngIf="!isLoading && roomTypes.length === 0" style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem; border:1px dashed var(--cds-border-strong); text-align:center;">
            <span class="material-symbols-outlined" style="font-size:1.5rem; color:var(--cds-text-secondary); margin-bottom:0.5rem;">hotel</span>
            <p style="font-size:0.75rem; color:var(--cds-text-secondary);">No hay tipos registrados.</p>
        </div>

        <div *ngIf="!isLoading && roomTypes.length > 0">
            <div *ngFor="let type of roomTypes" class="cds-catalog-item">
                <div style="flex:1; overflow:hidden;">
                    <h4 style="font-size:0.875rem; font-weight:500; color:var(--cds-text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ type.name }}</h4>
                    <p style="font-size:0.75rem; color:var(--cds-text-secondary); margin-top:0.25rem;">{{ type.description }}</p>
                    <span style="font-size:0.75rem; color:var(--cds-text-secondary); display:flex; align-items:center; gap:0.25rem; margin-top:0.25rem;">
                        <span class="material-symbols-outlined" style="font-size:0.875rem;">group</span>
                        {{ type.guestCapacity }} huéspedes máx.
                    </span>
                </div>
                <div class="cds-catalog-item__actions">
                    <button (click)="openUpdateModal(type)" class="cds-btn-icon" title="Editar">
                        <span class="material-symbols-outlined" style="font-size:1rem;">edit</span>
                    </button>
                    <button (click)="inactivateRoomType(type)" class="cds-btn-icon" style="color:var(--cds-support-error);" title="Eliminar">
                        <span class="material-symbols-outlined" style="font-size:1rem;">delete</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<app-room-type-modal
    [isOpen]="isModalOpen"
    [typeToEdit]="selectedRoomType"
    (onClose)="closeModal()"
    (onSuccess)="loadRoomTypes()">
</app-room-type-modal>
