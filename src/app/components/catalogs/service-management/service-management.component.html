<div style="display:flex; flex-direction:column; height:100%;">

    <div class="cds-catalog-column__header">
        <div class="cds-catalog-column__title">
            <span class="material-symbols-outlined">room_service</span>
            <div>
                <h3>Servicios</h3>
                <p>Servicios adicionales.</p>
            </div>
        </div>
        <button (click)="openCreateModal()" class="cds-btn-icon" style="color:var(--cds-interactive);" title="Nuevo Servicio">
            <span class="material-symbols-outlined">add</span>
        </button>
    </div>

    <div class="cds-catalog-column__body custom-scrollbar">

        <div *ngIf="isLoading" class="cds-spinner" style="padding:2rem;">
            <span class="material-symbols-outlined">progress_activity</span>
        </div>

        <div *ngIf="!isLoading && services.length === 0" style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem; border:1px dashed var(--cds-border-strong); text-align:center;">
            <span class="material-symbols-outlined" style="font-size:1.5rem; color:var(--cds-text-secondary); margin-bottom:0.5rem;">local_cafe</span>
            <p style="font-size:0.75rem; color:var(--cds-text-secondary);">No hay servicios registrados.</p>
        </div>

        <div *ngIf="!isLoading && services.length > 0">
            <div *ngFor="let srv of services" class="cds-catalog-item" style="align-items:center;">
                <div style="display:flex; align-items:center; gap:0.75rem; overflow:hidden; flex:1;">
                    <div style="width:2rem; height:2rem; background-color:var(--cds-support-info-bg); color:var(--cds-interactive); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                        <span class="material-symbols-outlined" style="font-size:1rem;">stars</span>
                    </div>
                    <h4 style="font-size:0.875rem; font-weight:500; color:var(--cds-text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ srv.name }}</h4>
                </div>
                <div class="cds-catalog-item__actions">
                    <button (click)="openUpdateModal(srv)" class="cds-btn-icon" title="Editar">
                        <span class="material-symbols-outlined" style="font-size:1rem;">edit</span>
                    </button>
                    <button (click)="inactivateService(srv)" class="cds-btn-icon" style="color:var(--cds-support-error);" title="Eliminar">
                        <span class="material-symbols-outlined" style="font-size:1rem;">delete</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<app-service-modal
    [isOpen]="isModalOpen"
    [serviceToEdit]="selectedService"
    (onClose)="closeModal()"
    (onSuccess)="loadServices()">
</app-service-modal>
