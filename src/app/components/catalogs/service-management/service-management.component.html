<div class="h-full flex flex-col animate-fade-in">
  <div class="flex justify-between items-center mb-4">
    <div>
      <h2 class="text-xl font-bold text-text-main flex items-center gap-2">
        <span class="material-symbols-outlined text-brand">room_service</span>
        Servicios
      </h2>
      <p class="text-text-muted text-xs mt-1">Servicios adicionales.</p>
    </div>

    <button (click)="openCreateModal()" class="bg-brand/10 text-brand p-2 rounded-lg hover:bg-brand hover:text-white transition-colors" title="Nuevo Servicio">
      <span class="material-symbols-outlined text-[20px]">add</span>
    </button>
  </div>

  <div *ngIf="isLoading" class="flex justify-center items-center py-10 flex-1">
    <span class="material-symbols-outlined animate-spin text-brand text-3xl">progress_activity</span>
  </div>

  <div *ngIf="!isLoading && services.length === 0" class="flex-1 border-2 border-dashed border-border-main rounded-xl flex flex-col items-center justify-center p-6 text-center">
    <span class="material-symbols-outlined text-3xl text-text-muted mb-2">local_cafe</span>
    <p class="text-sm text-text-muted">No hay servicios registrados.</p>
  </div>

  <div *ngIf="!isLoading && services.length > 0" class="flex-1 overflow-y-auto custom-scrollbar pr-2 space-y-3">
    <div *ngFor="let srv of services" class="bg-card border border-border-main rounded-xl p-4 shadow-sm hover:border-brand/50 transition-colors group flex justify-between items-center">
      
      <div class="flex items-center gap-3 overflow-hidden pr-2">
        <div class="w-8 h-8 bg-brand/10 text-brand rounded-lg flex items-center justify-center flex-shrink-0">
          <span class="material-symbols-outlined text-[18px]">stars</span>
        </div>
        <h3 class="font-semibold text-text-main text-sm truncate">{{ srv.name }}</h3>
      </div>

      <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0">
        <button (click)="openUpdateModal(srv)" class="text-text-muted hover:text-brand transition-colors p-1" title="Editar">
          <span class="material-symbols-outlined text-[16px]">edit</span>
        </button>
        <button (click)="inactivateService(srv)" class="text-text-muted hover:text-red-500 transition-colors p-1" title="Eliminar">
          <span class="material-symbols-outlined text-[16px]">delete</span>
        </button>
      </div>
    </div>
  </div>
</div>

<app-service-modal
  [isOpen]="isModalOpen"
  [serviceToEdit]="selectedService"
  (onClose)="closeModal()"
  (onSuccess)="loadServices()">
</app-service-modal>
