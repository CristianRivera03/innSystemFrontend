<div style="display:flex; flex-direction:column; height:100%;">

    <div class="cds-catalog-column__header">
        <div class="cds-catalog-column__title">
            <span class="material-symbols-outlined">calendar_month</span>
            <div>
                <h3>Temporadas</h3>
                <p>Fechas y multiplicadores de precio.</p>
            </div>
        </div>
        <button (click)="openCreateModal()" class="cds-btn-icon" style="color:var(--cds-interactive);" title="Nueva Temporada">
            <span class="material-symbols-outlined">add</span>
        </button>
    </div>

    <div class="cds-catalog-column__body custom-scrollbar">

        <div *ngIf="isLoading" class="cds-spinner" style="padding:2rem;">
            <span class="material-symbols-outlined">progress_activity</span>
        </div>

        <div *ngIf="!isLoading && seasons.length === 0" style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem; border:1px dashed var(--cds-border-strong); text-align:center;">
            <span class="material-symbols-outlined" style="font-size:1.5rem; color:var(--cds-text-secondary); margin-bottom:0.5rem;">event_busy</span>
            <p style="font-size:0.75rem; color:var(--cds-text-secondary);">No hay temporadas registradas.</p>
        </div>

        <div *ngIf="!isLoading && seasons.length > 0">
            <div *ngFor="let season of seasons" class="cds-catalog-item" style="flex-direction:column; align-items:stretch;">
                <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                    <h4 style="font-size:0.875rem; font-weight:500; color:var(--cds-text-primary);">{{ season.seasonName }}</h4>
                    <div class="cds-catalog-item__actions">
                        <button (click)="openUpdateModal(season)" class="cds-btn-icon" title="Editar">
                            <span class="material-symbols-outlined" style="font-size:1rem;">edit</span>
                        </button>
                        <button (click)="inactivateSeason(season)" class="cds-btn-icon" style="color:var(--cds-support-error);" title="Eliminar">
                            <span class="material-symbols-outlined" style="font-size:1rem;">delete</span>
                        </button>
                    </div>
                </div>

                <div style="display:flex; align-items:center; gap:0.25rem; font-size:0.75rem; color:var(--cds-text-secondary); margin-top:0.25rem;">
                    <span class="material-symbols-outlined" style="font-size:0.875rem;">date_range</span>
                    {{ season.startDate | date:'dd/MM/yyyy' }} - {{ season.endDate | date:'dd/MM/yyyy' }}
                </div>

                <div style="margin-top:0.5rem;">
                    <span class="cds-tag cds-tag--blue">
                        x{{ season.priceMultiplier }}
                    </span>
                    <span style="font-size:0.75rem; color:var(--cds-text-secondary); margin-left:0.25rem;">Multiplicador</span>
                </div>
            </div>
        </div>
    </div>
</div>

<app-season-modal
    [isOpen]="isModalOpen"
    [seasonToEdit]="selectedSeason"
    (onClose)="closeModal()"
    (onSuccess)="loadSeasons()">
</app-season-modal>
