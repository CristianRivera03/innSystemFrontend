<div class="h-full flex flex-col animate-fade-in">
  <div class="flex justify-between items-center mb-4">
    <div>
      <h2 class="text-xl font-bold text-text-main flex items-center gap-2">
        <span class="material-symbols-outlined text-brand">calendar_month</span>
        Temporadas
      </h2>
      <p class="text-text-muted text-xs mt-1">Fechas y multiplicadores de precio.</p>
    </div>
    <button (click)="openCreateModal()" class="bg-brand/10 text-brand p-2 rounded-lg hover:bg-brand hover:text-white transition-colors" title="Nueva Temporada">
      <span class="material-symbols-outlined text-[20px]">add</span>
    </button>
  </div>

  <div *ngIf="isLoading" class="flex justify-center items-center py-10 flex-1">
    <span class="material-symbols-outlined animate-spin text-brand text-3xl">progress_activity</span>
  </div>

  <div *ngIf="!isLoading && seasons.length === 0" class="flex-1 border-2 border-dashed border-border-main rounded-xl flex flex-col items-center justify-center p-6 text-center">
    <span class="material-symbols-outlined text-3xl text-text-muted mb-2">event_busy</span>
    <p class="text-sm text-text-muted">No hay temporadas registradas.</p>
  </div>

  <div *ngIf="!isLoading && seasons.length > 0" class="flex-1 overflow-y-auto custom-scrollbar pr-2 space-y-3">
    <div *ngFor="let season of seasons" class="bg-card border border-border-main rounded-xl p-4 shadow-sm hover:border-brand/50 transition-colors group">
      
      <div class="flex justify-between items-start mb-2">
        <h3 class="font-semibold text-text-main text-sm line-clamp-1">{{ season.seasonName }}</h3>
        <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
          <button (click)="openUpdateModal(season)" class="text-text-muted hover:text-brand transition-colors p-1" title="Editar">
            <span class="material-symbols-outlined text-[16px]">edit</span>
          </button>
          <button (click)="inactivateSeason(season)" class="text-text-muted hover:text-red-500 transition-colors p-1" title="Eliminar">
            <span class="material-symbols-outlined text-[16px]">delete</span>
          </button>
        </div>
      </div>
      
      <div class="flex items-center gap-2 text-xs text-text-muted mb-2">
        <span class="material-symbols-outlined text-[14px]">date_range</span>
        {{ season.startDate | date:'dd/MM/yyyy' }} - {{ season.endDate | date:'dd/MM/yyyy' }}
      </div>

      <div class="flex items-center gap-1 mt-2">
        <span class="text-xs font-medium px-2 py-1 bg-brand/10 text-brand rounded-md border border-brand/20">
          x{{ season.priceMultiplier }}
        </span>
        <span class="text-xs text-text-muted ml-1">Multiplicador</span>
      </div>

    </div>
  </div>
</div>

<app-season-modal
  [isOpen]="isModalOpen"
  [seasonToEdit]="selectedSeason"
  (onClose)="closeModal()"
  (onSuccess)="loadSeasons()">
</app-season-modal>
