<div class="cds-content cds-animate-fade-in" style="height:calc(100vh - 64px); display:flex; flex-direction:column;">

    <div class="cds-page-header" style="flex-shrink:0;">
        <div>
            <h1 class="cds-page-header__title">Gestión General</h1>
            <p class="cds-page-header__subtitle">Administra los tipos de habitación, servicios y temporadas de manera centralizada.</p>
        </div>
    </div>

    <div class="cds-catalog-grid" style="flex:1; overflow:hidden;">

        <!-- Columna 1: Tipos de Habitación -->
        <div class="cds-catalog-column">
            <app-room-type-management style="display:flex; flex-direction:column; height:100; overflow-y:auto;" class="custom-scrollbar"></app-room-type-management>
        </div>

        <!-- Columna 2: Servicios Adicionales -->
        <div class="cds-catalog-column">
            <app-service-management style="display:flex; flex-direction:column; height:100; overflow-y:auto;" class="custom-scrollbar"></app-service-management>
        </div>

        <!-- Columna 3: Temporadas -->
        <div class="cds-catalog-column">
            <app-season-management style="display:flex; flex-direction:column; height:100; overflow-y:auto;" class="custom-scrollbar"></app-season-management>
        </div>

    </div>
</div>
